<body>
<div id="game"></div><div class="vignette"></div><div class="grain"></div>
<header class="topbar"><div class="brand"><div class="crest">♜</div><div><div class="brand-title">حُماة الحِصن</div><div class="brand-sub">THE LAST FRONTIER</div></div></div><div class="top-stats"><div class="stat"><div class="stat-icon">◈</div><div><div class="stat-label">الذهب</div><div class="stat-value" id="gold">260</div></div></div><div class="stat"><div class="stat-icon" style="color:#7ed1ca">✦</div><div><div class="stat-label">المانا</div><div class="stat-value" id="mana">100</div></div></div><div class="stat"><div class="stat-icon" style="color:#d97c67">♥</div><div><div class="stat-label">الحصن</div><div class="stat-value"><span id="lives">20</span></div></div></div></div><div class="right-actions"><button class="icon-btn" id="pauseBtn" aria-label="إيقاف مؤقت">Ⅱ</button><button class="icon-btn" id="soundBtn" aria-label="الصوت">♫</button></div></header>

<div class="shade" id="modalShade"><div class="modal"><div class="modal-mark" id="modalMark">⚔</div><h2 id="modalTitle">حماة الحصن</h2><p id="modalText">استعد للدفاع عن المملكة.</p><div class="modal-row"><div class="modal-stat"><strong id="modalWave">01</strong><span>الموجة</span></div><div class="modal-stat"><strong id="modalKills">0</strong><span>عدو هُزم</span></div><div class="modal-stat"><strong id="modalGold">260</strong><span>ذهب</span></div></div><button class="action-btn" id="modalAction">ابدأ الحراسة</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const mount=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x899b8d);scene.fog=new THREE.FogExp2(0x899b8d,.018);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,120);camera.position.set(13,20,25);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdce9db,0x35463c,2));const sun=new THREE.DirectionalLight(0xffe6b8,3.2);sun.position.set(-8,18,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;scene.add(sun);

const groundMat=mat(0x63745b), pathMat=mat(0x97866a), stone=mat(0x85877b), darkStone=mat(0x424e49), goldMat=mat(0xd5ad66,.42,.55), foliage=mat(0x344c39),leaf2=mat(0x4e6546),steel=mat(0x75837e,.35,.7),red=mat(0x743c35),cloth=mat(0x9d5842),skin=mat(0xd4a87d);
function box(parent,x,y,z,sx,sy,sz,material){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cylinder(parent,x,y,z,rt,rb,h,material,seg=8){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(42,32),groundMat);floor.rotation.x=-Math.PI/2;floor.position.y=-.09;floor.receiveShadow=true;scene.add(floor);
// muted terrain tiles and rough grass tufts
for(let i=0;i<160;i++){let x=(Math.random()-.5)*38,z=(Math.random()-.5)*28;if(Math.abs(z)<3&&x>-14&&x<14)continue;const tuft=new THREE.Mesh(new THREE.ConeGeometry(.12+Math.random()*.12,.3+Math.random()*.35,4),Math.random()>.5?foliage:leaf2);tuft.position.set(x,.04,z);tuft.rotation.z=(Math.random()-.5)*.3;tuft.castShadow=true;scene.add(tuft)}
// winding road, with softly raised stone borders
const route=[new THREE.Vector3(-15,0,0),new THREE.Vector3(-9,0,0),new THREE.Vector3(-9,0,6),new THREE.Vector3(-2,0,6),new THREE.Vector3(-2,0,-5),new THREE.Vector3(5,0,-5),new THREE.Vector3(5,0,2),new THREE.Vector3(13,0,2)];
const curve=new THREE.CatmullRomCurve3(route);const pts=curve.getPoints(240);const roadShape=new THREE.Shape();roadShape.moveTo(-.78,0);roadShape.lineTo(.78,0); // custom ribbon via segment strips
const roadVertices=[],roadIndices=[];for(let i=0;i<pts.length;i++){const prev=pts[Math.max(0,i-1)],next=pts[Math.min(pts.length-1,i+1)],dx=next.x-prev.x,dz=next.z-prev.z,len=Math.hypot(dx,dz)||1,nx=-dz/len*.82,nz=dx/len*.82;roadVertices.push(pts[i].x+nx,.012,pts[i].z+nz,pts[i].x-nx,.012,pts[i].z-nz);if(i<pts.length-1){const a=i*2,b=a+1,c=a+2,d=a+3;roadIndices.push(a,c,b,b,c,d)}if(i%12===0&&i<pts.length-1){for(const side of [-1,1]){const peb=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.1,0),stone);peb.position.set(pts[i].x+nx*1.03*side,.08,pts[i].z+nz*1.03*side);peb.scale.y=.5;peb.castShadow=true;scene.add(peb)}}}const roadGeo=new THREE.BufferGeometry();roadGeo.setAttribute('position',new THREE.Float32BufferAttribute(roadVertices,3));roadGeo.setIndex(roadIndices);roadGeo.computeVertexNormals();const roadMesh=new THREE.Mesh(roadGeo,pathMat);roadMesh.receiveShadow=true;scene.add(roadMesh);
// forest border
for(let i=0;i<42;i++){let x=-17+Math.random()*34,z=(Math.random()>.5?1:-1)*(7+Math.random()*7);if(Math.abs(x+9)<1.5||Math.abs(x+2)<1.5||Math.abs(x-5)<1.5)continue;const h=1.5+Math.random()*2,tree=new THREE.Group();tree.position.set(x,0,z);cylinder(tree,0,h*.32,0,.18,.27,h*.65,mat(0x584638));const crown=new THREE.Mesh(new THREE.ConeGeometry(.8+Math.random()*.65,h,7),Math.random()>.45?foliage:leaf2);crown.position.y=h*.86;crown.castShadow=true;tree.add(crown);scene.add(tree)}
// keep and gate at destination
const keep=new THREE.Group();keep.position.set(13,0,2);scene.add(keep);for(let z=-1;z<=1;z+=2)for(let x=-1.05;x<=1.05;x+=2.1){box(keep,x,1.05,z,.8,2.1,.8,stone);const roof=cylinder(keep,x,2.35,z,.02,.58,.55,darkStone,4);roof.rotation.y=Math.PI/4}box(keep,0,.65,0,3.2,1.3,2.5,darkStone);box(keep,0,1.27,0,2.8,.18,2.1,stone);box(keep,0,.45,1.27,.85,.9,.13,mat(0x342f2a));for(let x=-.8;x<=.8;x+=.8){box(keep,x,1.55,1.28,.19,.3,.1,goldMat)}
// build pads
const padPositions=[[-12,0,-2.1],[-9,0,2.4],[-6.3,0,7.8],[-3.9,0,3.5],[-4.7,0,-4],[-.2,0,-7.2],[3.1,0,-1.7],[7.4,0,4.2],[10.8,0,-1.5]];
const pads=[];const padMat=mat(0x65736b,.55,.3);const padGlow=new THREE.MeshBasicMaterial({color:0xe6c47b,transparent:true,opacity:.2});
padPositions.forEach((p,i)=>{const g=new THREE.Group();g.position.set(p[0],0,p[2]);scene.add(g);const base=cylinder(g,0,.14,0,.86,.92,.28,padMat,12);const ring=new THREE.Mesh(new THREE.TorusGeometry(.78,.045,6,24),goldMat);ring.rotation.x=Math.PI/2;ring.position.y=.3;g.add(ring);const hover=new THREE.Mesh(new THREE.CylinderGeometry(.88,.88,.015,24),padGlow);hover.position.y=.3;hover.visible=false;g.add(hover);pads.push({group:g,occupied:false,hover,tower:null,index:i});});
let gold=260,mana=100,lives=20,wave=1,kills=0,active=false,paused=false,gameOver=false,speed=1,selected='archer',enemies=[],towers=[],shots=[],effects=[],spawnLeft=0,spawnTimer=0,betweenTimer=0;
const costs={archer:80,cannon:130};
function ui(){document.querySelector('#gold').textContent=gold;document.querySelector('#mana').textContent=mana;document.querySelector('#lives').textContent=lives;document.querySelector('#wave').textContent=String(wave).padStart(2,'0');document.querySelector('#enemyCount').textContent=active?`${enemies.length+spawnLeft} متبقٍ`:'جاهز';document.querySelector('#waveProgress').style.width=`${active?Math.max(0,100-(spawnLeft+enemies.length)/(7+wave*2)*100):Math.min(100,(wave-1)/12*100)}%`;document.querySelector('#waveState').textContent=active?'المعركة جارية':'استعد للهجوم';document.querySelector('#waveBtn').disabled=active||gameOver;document.querySelector('#waveBtn').innerHTML=active?'الموجة جارية <span>⚔</span>':'ابدأ الموجة&nbsp; <span>▶</span>';document.querySelector('#buildHint').textContent=`${selected==='archer'?'الرماة':'المدفع'} · المس منصة`;
 document.querySelectorAll('.spell').forEach(b=>b.disabled=mana<({lightning:35,meteor:55,freeze:45}[b.dataset.spell])||gameOver)}
function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2100)}
function makeTower(type,pad){const g=new THREE.Group();g.position.set(pad.group.position.x,0,pad.group.position.z);scene.add(g);cylinder(g,0,.22,0,.52,.62,.44,darkStone,8);cylinder(g,0,.48,0,.4,.48,.18,stone,8);let head;
 if(type==='archer'){cylinder(g,0,1.02,0,.27,.33,.95,mat(0x72583d),8);cylinder(g,0,1.54,0,.36,.38,.16,goldMat,8);head=box(g,0,1.98,0,.63,.66,.63,mat(0x5d4935));for(let y=1.66;y<=2.3;y+=.32)for(let x of [-.22,.22])box(g,x,y,.32,.12,.17,.12,goldMat);cylinder(g,0,2.42,0,.17,.28,.18,steel,8);}
 else{cylinder(g,0,.9,0,.3,.42,.68,mat(0x47534f),10);head=new THREE.Group();head.position.y=1.42;g.add(head);cylinder(head,0,0,0,.38,.4,.25,steel,10);const barrel=cylinder(head,0,.18,-.34,.16,.19,.9,darkStone,10);barrel.rotation.x=Math.PI/2;const rim=cylinder(head,0,.18,-.76,.22,.22,.13,goldMat,10);rim.rotation.x=Math.PI/2;}
 const flag=box(g,.35,2.5,0,.045,.58,.04,red);flag.rotation.z=-.12;const banner=box(g,.49,2.58,0,.35,.19,.035,goldMat);banner.rotation.z=-.12;
 pad.occupied=true;pad.tower={group:g,type,range:type==='archer'?6.6:5.7,damage:type==='archer'?17:38,rate:type==='archer'?.85:1.55,cool:Math.random()*.5,head,kills:0};towers.push(pad.tower);pad.hover.visible=false;return pad.tower;}
function selectTower(type){selected=type;document.querySelectorAll('.tower-card').forEach(c=>c.classList.toggle('selected',c.dataset.tower===type));ui()}
document.querySelectorAll('.tower-card').forEach(b=>b.onclick=()=>selectTower(b.dataset.tower));
function enemyMake(){const roll=Math.random(),type=wave>3&&roll<.2?'brute':wave>1&&roll<.46?'runner':'raider';const g=new THREE.Group();const armor=type==='brute'?mat(0x52636a):mat(type==='runner'?0x87674b:0x65483c);const scale=type==='brute'?1.3:type==='runner'?.82:1;g.scale.setScalar(scale);const torso=box(g,0,.88,0,.55,.73,.34,armor);const head=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10),skin);head.position.y=1.42;head.castShadow=true;g.add(head);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.27,12,8,0,Math.PI*2,0,Math.PI/2),darkStone);helmet.position.y=1.51;helmet.castShadow=true;g.add(helmet);for(let side of [-1,1]){box(g,side*.37,.91,0,.18,.5,.2,armor);box(g,side*.17,.35,0,.2,.55,.22,darkStone)}const sword=box(g,.48,.66,-.1,.08,.56,.09,steel);sword.rotation.z=.35;const healthMax=type==='brute'?115:type==='runner'?48:65;const bar=new THREE.Group();bar.position.y=1.95;g.add(bar);const back=new THREE.Mesh(new THREE.PlaneGeometry(.82,.09),mat(0x282c2a));bar.add(back);const fill=new THREE.Mesh(new THREE.PlaneGeometry(.78,.055),new THREE.MeshBasicMaterial({color:0xc86d50}));fill.position.z=.01;bar.add(fill);scene.add(g);return{group:g,hp:healthMax,max:healthMax,speed:(type==='runner'?3.5:type==='brute'?1.7:2.5)*(1+wave*.045),progress:0,type,bar,fill,hit:0};}
function startWave(){if(active||gameOver)return;active=true;spawnLeft=7+wave*2;spawnTimer=.4;betweenTimer=0;ui();toast(`بدأت الموجة ${wave} — استعد!`)}
document.querySelector('#waveBtn').onclick=startWave;
function makeShot(t,e){const start=t.group.position.clone();start.y=t.type==='archer'?2.15:1.75;const end=e.group.position.clone();end.y=1;const lineGeom=new THREE.BufferGeometry().setFromPoints([start,end]);const line=new THREE.Line(lineGeom,new THREE.LineBasicMaterial({color:t.type==='archer'?0xf1d38b:0xff9d58,transparent:true,opacity:.9}));scene.add(line);shots.push({obj:line,target:e,time:.18,damage:t.damage,tower:t});if(t.type==='cannon'){const puff=new THREE.Mesh(new THREE.SphereGeometry(.28,8,8),new THREE.MeshBasicMaterial({color:0xffc475,transparent:true,opacity:.8}));puff.position.copy(start);scene.add(puff);effects.push({obj:puff,time:.22,kind:'flash'})}}
function damageEnemy(e,dmg){if(!e||e.dead)return;e.hp-=dmg;e.hit=.12;e.fill.scale.x=Math.max(.001,e.hp/e.max);if(e.hp<=0){e.dead=true;scene.remove(e.group);gold+=e.type==='brute'?24:12;mana=Math.min(100,mana+3);kills++;ui();const puff=new THREE.Mesh(new THREE.SphereGeometry(.35,8,8),new THREE.MeshBasicMaterial({color:0xd9a96b,transparent:true,opacity:.8}));puff.position.copy(e.group.position);puff.position.y=.8;scene.add(puff);effects.push({obj:puff,time:.35,kind:'burst'});}}
function castSpell(type){if(gameOver)return;const cost={lightning:35,meteor:55,freeze:45}[type];if(mana<cost){toast('المانا غير كافية');return}if(!enemies.length){toast('انتظر وصول الأعداء إلى الميدان');return}mana-=cost;const alive=enemies.filter(e=>!e.dead);if(type==='lightning'){const target=alive.sort((a,b)=>b.progress-a.progress)[0];for(let i=0;i<Math.min(3,alive.length);i++){const e=alive.sort((a,b)=>b.progress-a.progress)[i];damageEnemy(e,90);const bolt=new THREE.Group();let prev=new THREE.Vector3(e.group.position.x,8,e.group.position.z);for(let j=0;j<7;j++){const next=new THREE.Vector3(e.group.position.x+(Math.random()-.5)*1.5,8-(j+1)*1.15,e.group.position.z+(Math.random()-.5)*1.3);const geo=new THREE.BufferGeometry().setFromPoints([prev,next]);bolt.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xb8f7ff,transparent:true,opacity:.95})));prev=next}scene.add(bolt);effects.push({obj:bolt,time:.45,kind:'lightning'})}toast('ضربة برق!')}else if(type==='meteor'){const target=alive.sort((a,b)=>b.progress-a.progress)[0],pos=target.group.position.clone();const meteor=new THREE.Mesh(new THREE.IcosahedronGeometry(.52,1),new THREE.MeshStandardMaterial({color:0xff783b,emissive:0xd8340b,emissiveIntensity:2}));meteor.position.set(pos.x+1,8,pos.z);scene.add(meteor);effects.push({obj:meteor,time:.65,kind:'meteor',target:pos});for(const e of alive)if(e.group.position.distanceTo(pos)<3.3)damageEnemy(e,120);toast('النيازك تمطر على الأعداء!')}else{alive.forEach(e=>e.freeze=3.5);const aura=new THREE.Mesh(new THREE.RingGeometry(1,4,36),new THREE.MeshBasicMaterial({color:0x8be5ff,transparent:true,opacity:.8,side:THREE.DoubleSide}));aura.rotation.x=-Math.PI/2;aura.position.set(0,.15,0);scene.add(aura);effects.push({obj:aura,time:1.2,kind:'freeze'});toast('تجمّدت جحافل الأعداء!')}ui();document.querySelector(`[data-spell="${type}"]`).classList.add('cooling');setTimeout(()=>document.querySelector(`[data-spell="${type}"]`).classList.remove('cooling'),900)}
document.querySelectorAll('.spell').forEach(b=>b.onclick=()=>castSpell(b.dataset.spell));
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down={x:0,y:0};renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)return;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(pads.map(p=>p.group.children[0]),false);if(!hits.length)return;const pad=pads.find(p=>p.group.children[0]===hits[0].object);if(!pad)return;if(pad.occupied){toast('هذه المنصة مشغولة بالفعل');return}if(gold<costs[selected]){toast('ليس لديك ذهب كافٍ');return}gold-=costs[selected];makeTower(selected,pad);ui();toast(selected==='archer'?'تم بناء برج الرماة':'تم بناء برج المدفع')});
// Hover highlight and selection feedback
renderer.domElement.addEventListener('pointermove',e=>{pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(pads.map(p=>p.group.children[0]),false);pads.forEach(p=>p.hover.visible=!!hits.length&&hits[0].object===p.group.children[0]&&!p.occupied)});
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?60:42;camera.position.y=innerWidth<700?31:20;camera.position.z=innerWidth<700?35:25;camera.position.x=innerWidth<700?12:13;camera.lookAt(0,0,0);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
const routeLength=curve.getLength();let last=performance.now(),uiClock=0;
function finishWave(){active=false;if(wave>=12){gameOver=true;showModal(true);return}gold+=45+wave*5;mana=Math.min(100,mana+18);toast(`انتصرت في الموجة ${wave} — مكافأة ${45+wave*5} ذهب`);wave++;betweenTimer=3;ui()}
function showModal(end=false){const shade=document.querySelector('#modalShade');shade.classList.add('open');document.querySelector('#modalMark').textContent=end?(lives<=0?'☠':'🏆'):'♜';document.querySelector('#modalTitle').textContent=end?(lives<=0?'سقط الحصن':'النصر للمملكة!'):'حُماة الحِصن';document.querySelector('#modalText').textContent=end?(lives<=0?'لقد اخترق الأعداء أسوار القلعة. أعد بناء دفاعاتك وحاول مجدداً.':'دافعت عن المملكة وأتممت جميع موجات الغزو!'): 'ابنِ أبراج الرماة والمدافع، ثم ابدأ الموجة. استخدم قوى البرق والنيزك والتجميد في اللحظة المناسبة.';document.querySelector('#modalWave').textContent=String(wave).padStart(2,'0');document.querySelector('#modalKills').textContent=kills;document.querySelector('#modalGold').textContent=gold;document.querySelector('#modalAction').textContent=end?'العب من جديد':'ابدأ الحراسة'}
document.querySelector('#modalAction').onclick=()=>{document.querySelector('#modalShade').classList.remove('open');if(gameOver){location.reload()}else{startWave()}};
document.querySelector('#pauseBtn').onclick=()=>{if(gameOver)return;paused=!paused;document.querySelector('#pauseBtn').textContent=paused?'▶':'Ⅱ';if(paused){document.querySelector('#modalMark').textContent='Ⅱ';document.querySelector('#modalTitle').textContent='استراحة المحارب';document.querySelector('#modalText').textContent='المعركة متوقفة مؤقتاً. خذ نفساً ثم عُد لحماية الحصن.';document.querySelector('#modalWave').textContent=String(wave).padStart(2,'0');document.querySelector('#modalKills').textContent=kills;document.querySelector('#modalGold').textContent=gold;document.querySelector('#modalAction').textContent='متابعة اللعب';document.querySelector('#modalShade').classList.add('open')}else document.querySelector('#modalShade').classList.remove('open')};
let soundOn=true;document.querySelector('#soundBtn').onclick=()=>{soundOn=!soundOn;document.querySelector('#soundBtn').textContent=soundOn?'♫':'♪';toast(soundOn?'الصوت مفعّل':'الصوت مكتوم')};
document.querySelector('#speedBtn').onclick=()=>{speed=speed===1?2:1;document.querySelector('#speedBtn').textContent=`▶ ${speed}×`};
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){const step=dt*speed;
 if(active){if(spawnLeft>0){spawnTimer-=step;if(spawnTimer<=0){enemies.push(enemyMake());spawnLeft--;spawnTimer=Math.max(.48,1.08-wave*.035)}}for(const e of enemies){if(e.dead)continue;if(e.freeze>0)e.freeze-=step;else e.progress+=e.speed*step/routeLength;const p=curve.getPointAt(Math.min(e.progress,1));e.group.position.set(p.x,0,p.z);const tangent=curve.getTangentAt(Math.min(e.progress,.999));e.group.rotation.y=Math.atan2(tangent.x,tangent.z);e.group.position.y=Math.sin(now*.009+e.progress*20)*.025;if(e.hit>0){e.hit-=step;e.group.scale.setScalar((e.type==='brute'?1.3:e.type==='runner'?.82:1)*(e.hit>0?.94:1))}if(e.progress>=.995&&!e.dead){e.dead=true;scene.remove(e.group);lives-=e.type==='brute'?3:1;ui();if(lives<=0){lives=0;gameOver=true;active=false;showModal(true);break}}}
 enemies=enemies.filter(e=>!e.dead);for(const t of towers){t.cool-=step;let target=null,best=Infinity;for(const e of enemies){const d=t.group.position.distanceTo(e.group.position);if(d<t.range&&e.progress<best){best=e.progress;target=e}}if(target){t.head.lookAt(target.group.position.x, t.head.position.y, target.group.position.z);if(t.cool<=0){makeShot(t,target);t.cool=t.rate}}}if(spawnLeft===0&&enemies.length===0&&!gameOver)finishWave();}
 for(const s of shots){s.time-=step;if(s.time<=0){scene.remove(s.obj);if(s.target&&!s.target.dead){if(s.tower.type==='cannon'){const p=s.target.group.position.clone();for(const e of enemies)if(e.group.position.distanceTo(p)<1.9)damageEnemy(e,s.damage); }else damageEnemy(s.target,s.damage)}s.dead=true}}shots=shots.filter(s=>!s.dead);
 for(const e of effects){e.time-=step;if(e.kind==='meteor'){e.obj.position.y=Math.max(.35,e.obj.position.y-step*12);if(e.time<.14){const boom=new THREE.Mesh(new THREE.SphereGeometry(1.2,12,10),new THREE.MeshBasicMaterial({color:0xff9a4f,transparent:true,opacity:.48}));boom.position.copy(e.target);boom.position.y=.6;scene.add(boom);effects.push({obj:boom,time:.28,kind:'burst'});e.kind='impact'}}else if(e.kind==='freeze')e.obj.scale.setScalar(1+(1.2-e.time)*.7);else if(e.kind==='burst'||e.kind==='flash')e.obj.scale.multiplyScalar(1.035);if(e.time<=0){scene.remove(e.obj);e.dead=true}}effects=effects.filter(e=>!e.dead);
 if(!active&&!gameOver&&betweenTimer>0){betweenTimer-=step;if(betweenTimer<=0){document.querySelector('#waveBtn').innerHTML=`ابدأ الموجة ${String(wave).padStart(2,'0')} &nbsp; <span>▶</span>`;ui()}}
 uiClock+=dt;if(uiClock>.25){uiClock=0;ui()}}
 renderer.render(scene,camera)}
ui();showModal(false);requestAnimationFrame(animate);
